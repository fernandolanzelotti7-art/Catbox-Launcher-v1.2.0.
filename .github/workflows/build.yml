
name: Build Catbox Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/catbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: catbox

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: catbox-launcher-windows
          path: catbox/release/*.exe
          if-no-files-found: error
